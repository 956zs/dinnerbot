[package]
name = "dinnerbot"
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
description = "A Discord dinner 8-ball bot written in Rust."
license = "MIT"
publish = false

[dependencies]
dotenvy = "0.15"
poise = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
